<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion Chat</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"><style>
/* Layout: sticky section nav + single reading column; interactive 3-pane mock as the hero, blueprint-style diagram below */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#eceef4; --fg:#1b1d2a; --muted:#5d6177; --line:#d9dce8;
  --accent:#5b4bdb; --accent-soft:#e6e3fb; --teal:#0f8b8d; --warn:#b4570a;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-m:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1b1d2b; --surface2:#242738; --fg:#e8e9f2; --muted:#9a9eb8; --line:#2f3248;
  --accent:#9d92ff; --accent-soft:#2c2850; --teal:#4cc9c4; --warn:#f0a35c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1b1d2b; --surface2:#242738; --fg:#e8e9f2; --muted:#9a9eb8; --line:#2f3248;
  --accent:#9d92ff; --accent-soft:#2c2850; --teal:#4cc9c4; --warn:#f0a35c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.6;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:16px}
p{margin:0;max-width:65ch}
.eyebrow{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);font-size:17px;margin-top:12px}
header{display:flex;flex-direction:column;gap:6px}
section{display:flex;flex-direction:column;gap:20px;min-width:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* mock app */
.app{height:calc(100vh - 32px);display:grid;grid-template-columns:240px minmax(0,1fr) 270px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-height:520px}
.pane{min-width:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--line)}
.pane-h{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.search{margin:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font:inherit;font-size:13px;width:calc(100% - 24px)}
.threads{display:flex;flex-direction:column}
.thread{display:flex;gap:10px;padding:10px 14px;border:0;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.thread:hover{background:var(--surface2)}
.thread[aria-pressed="true"]{background:var(--accent-soft)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;color:#fff}
.tmeta{min-width:0;flex:1}
.tname{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.tname time{font-weight:400;color:var(--muted);font-size:11px}
.tsnip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .tsnip{color:var(--fg);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
.topbar{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.topbar .grow{flex:1;min-width:0}
.topbar small{color:var(--muted);display:block;font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.stream{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px;background:var(--surface2)}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg .ts{display:block;font-size:10px;opacity:.65;margin-top:3px;font-family:var(--font-m)}
.msg .voice{display:flex;align-items:center;gap:8px;margin-top:6px}
.msg .bar{height:4px;flex:1;min-width:60px;background:var(--line);border-radius:2px;position:relative}
.msg .bar i{position:absolute;inset:0 60% 0 0;background:var(--teal);border-radius:2px}
.scene{align-self:flex-start;width:min(78%,260px);aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--teal);display:grid;place-items:center;color:var(--teal);font-family:var(--font-m);font-size:12px;text-align:center;padding:8px;
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--teal) 8%,transparent) 10px 20px)}
.compose{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--teal);color:var(--teal);background:none;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{background:var(--teal);color:var(--surface)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font:inherit;font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}
.gallery div{aspect-ratio:1;border-radius:8px}
.ctx{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.ctx h3{font-size:12px;font-family:var(--font-m);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-bottom:4px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.attr{background:var(--surface2);border-radius:8px;padding:6px 8px}
.attr b{display:block;font-size:10px;font-family:var(--font-m);color:var(--muted);text-transform:uppercase;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px}
.note{font-size:12px;color:var(--muted)}

/* diagram */
.diagram{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;overflow-x:auto}
.diagram svg{display:block;min-width:640px;width:100%;height:auto}
.diagram text{font-family:var(--font-m);font-size:12px;fill:var(--fg)}
.diagram .sub{fill:var(--muted);font-size:10.5px}
.diagram .box{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.diagram .hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.diagram .ln{stroke:var(--muted);stroke-width:1.2;fill:none}

/* tables and cards */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{color:var(--muted);font-size:14px}
.card code,td code,p code{font-family:var(--font-m);font-size:12.5px;background:var(--surface2);padding:1px 6px;border-radius:4px}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.layer .tier{font-family:var(--font-m);font-size:12px;color:var(--accent);display:flex;justify-content:space-between}
.layer .tier em{color:var(--muted);font-style:normal}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.phase{border-top:3px solid var(--accent);background:var(--surface);border-radius:0 0 12px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.phase:nth-child(2){border-top-color:var(--teal)}
.phase:nth-child(3){border-top-color:var(--warn)}
.phase ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
pre{margin:0;font-family:var(--font-m);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}

@media (max-width:900px){
  .app{height:calc(100vh - 32px);grid-template-columns:1fr}
  .pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .threads{flex-direction:row;overflow-x:auto}
  .thread{min-width:200px;border-bottom:0;border-right:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
.stream{overflow-y:auto}.stream img{max-width:78%;border-radius:12px;align-self:flex-start}.pane{min-height:0}.ctx{overflow-y:auto}.cost{align-self:flex-start;font:10px 'JetBrains Mono',monospace;color:var(--muted)}.err{color:var(--warn);font-size:12px;align-self:center}.stream img,#gallery img{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:50;background:rgba(8,9,14,.88);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
#lb[hidden]{display:none}
#lb img{max-width:min(96vw,1400px);max-height:88vh;border-radius:10px;box-shadow:0 10px 50px rgba(0,0,0,.6);cursor:default}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.28)}
#lb .x{top:max(14px,env(safe-area-inset-top));right:16px}#lb .p{left:14px;top:50%}#lb .n{right:14px;top:50%}
[hidden]{display:none!important}</style></head><body><div class="wrap"><div class="app" id="app">
    <div class="pane">
      <div class="pane-h"><span data-i="conversations">Conversations</span><span id="count">3</span></div>
      <input class="search" id="q" type="search" placeholder="Search contacts" data-ph="search">
      <div class="threads" id="threads"></div>
    </div>
    <div class="pane">
      <div class="topbar">
        <div class="av" id="tav"></div>
        <div class="grow"><strong id="tname"></strong><small id="trole"></small></div>
        <button class="btn" id="call" type="button" data-i="call">Call</button>
        <button class="btn" type="button" id="settingsBtn" data-i="settings">Settings</button>
        <div id="settings" hidden style="position:absolute;right:12px;top:52px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18)"><label style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span data-i="language">Language</span><select id="lang" class="btn"><option value="en">English</option><option value="tr">Türkçe</option></select></label><label style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span data-i="emojis">Emojis 😊</span><input type="checkbox" id="emoji" checked></label><label style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span data-i="model">Model</span><select id="model" class="btn" style="max-width:190px"></select></label><a href="/e2b" style="color:var(--accent)">Top-up via E2B</a><a href="/balance" data-i="bal" style="color:var(--accent)">Balance</a><a href="/pay" data-i="pay" style="color:var(--accent)">Payment request</a></div>
      </div>
      <div class="stream" id="stream" aria-live="polite"></div>
      <div class="compose">
        <div class="chips">
          <button class="chip" type="button" data-q="image" data-i="img">Show me the scene: Image</button>
          <button class="chip" type="button" data-q="video" data-i="vid">Show me the scene: Video</button>
        </div>
        <div class="note" id="costbar" style="font-family:var(--font-m);font-size:11px"></div>
        <form class="row" id="form">
          <input id="msg" type="text" autofocus placeholder="Write a message" data-ph="msg" autocomplete="off">
          <button class="btn primary" type="submit" data-i="send">Send</button>
        </form>
      </div>
    </div>
    <div class="pane">
      <div class="pane-h"><span data-i="persona">Persona</span><span data-i="context">Context</span></div>
      <div class="gallery" id="gallery"></div>
      <div class="ctx">
        <div><h3 style="display:flex;justify-content:space-between;align-items:center"><span data-i="premise">Premise</span><button class="btn" type="button" id="scEdit" data-i="edit" style="padding:2px 8px;text-transform:none;letter-spacing:0">Edit</button></h3><div id="premise"></div><div id="scForm" hidden style="display:flex;flex-direction:column;gap:6px"><textarea id="scText" rows="6" maxlength="1200" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font:inherit;font-size:13px;resize:vertical" aria-label="Scenario"></textarea><div class="row"><button class="btn primary" type="button" id="scSave" data-i="save">Save</button><button class="btn" type="button" id="scReset" data-i="reset">Reset</button><button class="btn" type="button" id="scCancel" data-i="cancel">Cancel</button></div></div></div>
        <div><h3 data-i="attrs">Attributes</h3><div class="attrs" id="attrs"></div></div>
        <div><h3 data-i="tags">Personality</h3><div class="tags" id="tags"></div></div>
        <div><h3 data-i="modelWhy">Model</h3><div id="mname" style="font-family:var(--font-m);font-size:12px;color:var(--accent);word-break:break-all"></div><div id="mwhy" style="font-size:12px;color:var(--muted);margin-top:4px"></div></div>
      </div>
    </div>
  </div></div><div id="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer"><button class="x" type="button" aria-label="Close">✕</button><button class="p" type="button" aria-label="Previous">‹</button><img id="lbi" alt=""><button class="n" type="button" aria-label="Next">›</button></div><script>
const T={en:{modelWhy:'Model in use and why',model:'Model',balance:'Balance',today:'Spent today',calls:'calls',noCredit:'Venice credit has run out. Add credit to continue.',topup:'Add credit',edit:'Edit',save:'Save',reset:'Reset to default',cancel:'Cancel',scSaved:'Scenario updated',settings:'Settings',language:'Language',emojis:'Emojis 😊',pay:'Payment request',bal:'Balance',conversations:'Conversations',persona:'Persona',context:'Context',call:'Call',img:'Show me the scene: Image',vid:'Show me the scene: Video',send:'Send',premise:'Premise',attrs:'Attributes',tags:'Personality',search:'Search contacts',msg:'Write a message',play:'Play voice',gen:'Generating...',aL:['Age','Build','Profession','Dialect'],eReply:'Reply failed: ',eImg:'Generation failed: ',eVoice:'Voice failed: ',call2:'Voice calls (WebRTC) arrive in phase 3.'},
tr:{modelWhy:'Kullanılan model ve nedeni',model:'Model',balance:'Bakiye',today:'Bugünkü masraf',calls:'istek',noCredit:'Venice kredisi bitti. Devam etmek için bakiye yükleyin.',topup:'Bakiye yükle',edit:'Düzenle',save:'Kaydet',reset:'Varsayılana dön',cancel:'İptal',scSaved:'Senaryo güncellendi',settings:'Ayarlar',language:'Dil',emojis:'Emojiler 😊',pay:'Ödeme talebi',bal:'Bakiye',conversations:'Sohbetler',persona:'Karakter',context:'Bağlam',call:'Ara',img:'Sahneyi göster: Görsel',vid:'Sahneyi göster: Video',send:'Gönder',premise:'Senaryo',attrs:'Özellikler',tags:'Kişilik',search:'Kişi ara',msg:'Bir mesaj yaz',play:'Sesi çal',gen:'Üretiliyor...',aL:['Yaş','Yapı','Meslek','Şive'],eReply:'Yanıt alınamadı: ',eImg:'Üretim başarısız: ',eVoice:'Ses başarısız: ',call2:'Sesli aramalar (WebRTC) 3. aşamada gelecek.'}};
let S={lang:'en',emoji:true,model:''};try{Object.assign(S,JSON.parse(localStorage.getItem('settings')||'{}'))}catch(e){}
const t=k=>T[S.lang][k];
const pv=(p,k)=>S.lang==='tr'&&p[k+'_tr']?p[k+'_tr']:p[k];
function applyI18n(){document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(e=>{if(e.dataset.i!=='call'||e.textContent!==t('call2'))e.textContent=t(e.dataset.i)});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph);e.setAttribute('aria-label',t(e.dataset.ph))});
  $('lang').value=S.lang;$('emoji').checked=S.emoji;if(P.length){renderThreads();if(cur)fillPersona()}}
function saveS(){try{localStorage.setItem('settings',JSON.stringify(S))}catch(e){}}
const usd=n=>n==null?'':'$'+(n<0.01?n.toFixed(4):n.toFixed(3));
async function refreshCosts(){try{const c=await(await api('/api/costs')).json();
  $('costbar').textContent=`${t('balance')} ${usd(c.balance)} · ${t('today')} ${usd(c.today.usd)} (${c.today.n} ${t('calls')})`}catch(e){}}

async function showModel(ch){try{ch=ch||await(await api('/api/model-choice?persona='+cur.id+'&lang='+S.lang+'&model='+encodeURIComponent(S.model||''))).json();
  $('mname').textContent=ch.model+(ch.price!=null?`  ($${ch.price}/1M out)`:'');$('mwhy').textContent=S.lang==='tr'?ch.reason_tr:ch.reason_en}catch(e){}}
let P=[],cur=null,busy=false;const focusMsg=()=>{try{if(document.activeElement!==$('q'))$('msg').focus()}catch(e){}};const $=i=>document.getElementById(i);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
function note(m){const d=document.createElement('div');d.className='err';if(/NO_CREDIT/.test(m)){d.innerHTML=esc(t('noCredit'))+' <a href="/balance" style="color:var(--accent)">'+esc(t('topup'))+'</a>'}else d.textContent=m;$('stream').appendChild(d)}
function renderThreads(){
  const f=$('q').value.toLowerCase(),box=$('threads');box.innerHTML='';
  const list=P.filter(p=>p.name.toLowerCase().includes(f)||p.role.toLowerCase().includes(f));$('count').textContent=list.length;
  list.forEach(p=>{const b=document.createElement('button');b.className='thread';b.type='button';b.setAttribute('aria-pressed',p===cur);
    b.innerHTML=`<div class="av" style="background:${p.color}">${p.name[0]}</div><div class="tmeta"><div class="tname"><span>${p.name}</span><time>${p.last?fmt(p.last.ts):''}</time></div><div class="tsnip">${esc(p.last?p.last.content:pv(p,'role'))}</div></div>`;
    b.onclick=()=>select(p);box.appendChild(b)})}
function addMsg(m){
  const d=document.createElement('div');
  if(m.kind==='note'){d.className='err';d.textContent=m.content}
  else if(m.kind==='video'){d.innerHTML=`<video src="${m.content}" controls autoplay loop muted style="max-width:78%;border-radius:12px"></video>`;d.style.display='contents'}
  else if(m.kind==='image'){d.innerHTML=`<img src="${m.content}" alt="Generated scene">`+(m.cost!=null?`<div class="cost">${usd(m.cost)}${m.model?' · '+esc(m.model):''}</div>`:'');d.style.display='contents'}
  else{d.className='msg'+(m.role==='user'?' me':'');d.innerHTML=esc(m.content)+(m.role!=='user'?'<div class="voice"><button class="btn" type="button" style="padding:2px 8px" data-play>'+t('play')+'</button></div>':'')+`<span class="ts">${fmt(m.ts)}${m.cost!=null&&m.role!=='user'?' · '+usd(m.cost):''}${m.model&&m.role!=='user'?' · '+esc(m.model):''}</span>`}
  $('stream').appendChild(d);$('stream').scrollTop=1e6;return d}
function fillPersona(){const p=cur;$('tav').style.background=p.color;$('tav').textContent=p.name[0];$('tname').textContent=p.name;$('trole').textContent=pv(p,'role');
  $('premise').textContent=pv(p,'scenario');
  const vals=S.lang==='tr'&&p.attrs_tr?p.attrs_tr:p.attrs.map(a=>a[1]);
  $('attrs').innerHTML=vals.map((v,i)=>`<div class="attr"><b>${t('aL')[i]}</b>${v}</div>`).join('');
  $('tags').innerHTML=pv(p,'tags').map(x=>`<span>${x}</span>`).join('')}
async function select(p){cur=p;renderThreads();
  $('gallery').innerHTML='';fillPersona();showModel();
  $('stream').innerHTML='';const {messages}=await(await api('/api/chat/'+p.id)).json();
  messages.forEach(addMsg);focusMsg();setTimeout(toBottom,300);$('gallery').innerHTML=messages.filter(m=>m.kind==='image').map(m=>`<img src="${m.content}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" alt="">`).join('')}
$('form').onsubmit=async e=>{e.preventDefault();const v=$('msg').value.trim();if(!v||busy)return;busy=true;$('msg').value='';
  addMsg({role:'user',kind:'text',content:v,ts:Date.now()});
  try{const r=await(await post('/api/chat/'+cur.id,{text:v,lang:S.lang,emoji:S.emoji,model:S.model})).json();addMsg({role:'assistant',kind:'text',content:r.reply,ts:r.ts,cost:r.cost.usd,model:r.model});refreshCosts();showModel(r.choice);cur.last={content:r.reply,ts:r.ts};renderThreads()}
  catch(err){note(t('eReply')+err.message)}busy=false;focusMsg()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=async()=>{
  if(busy)return;busy=true;c.disabled=true;const old=c.textContent;c.textContent=t('gen');
  try{const isV=c.dataset.q==='video';const r=await(await post('/api/'+(isV?'video/':'image/')+cur.id)).json();addMsg({role:'assistant',kind:isV?'video':'image',content:r.url,cost:r.cost.usd,model:r.model});refreshCosts();if(!isV)$('gallery').insertAdjacentHTML('afterbegin',`<img src="${r.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" alt="">`)}
  catch(err){note(t('eImg')+err.message)}applyI18n();c.disabled=false;busy=false;focusMsg()});
$('stream').addEventListener('click',async e=>{const b=e.target;if(b.dataset.play===undefined)return;
  const text=b.closest('.msg').firstChild.textContent;b.textContent='Loading...';
  try{const r=await post('/api/tts/'+cur.id,{text,lang:S.lang});const c=parseFloat(r.headers.get('X-Cost-USD'));if(c>=0)b.insertAdjacentHTML('afterend',` <span class="ts">${usd(c)}</span>`);refreshCosts();const a=new Audio(URL.createObjectURL(await r.blob()));a.onended=()=>b.textContent=t('play');await a.play();b.textContent='Playing'}
  catch(err){b.textContent=t('play');note(t('eVoice')+err.message)}});
$('call').onclick=()=>note(t('call2'));

// Lightbox: click any chat or gallery picture to open it large; arrows/Esc work.
let LB={list:[],i:0};
function lbShow(){$('lbi').src=LB.list[LB.i];document.querySelectorAll('#lb .p,#lb .n').forEach(b=>b.hidden=LB.list.length<2)}
function lbOpen(src){LB.list=[...new Set([...document.querySelectorAll('#stream img')].map(i=>i.getAttribute('src')))];LB.i=Math.max(0,LB.list.indexOf(src));lbShow();$('lb').hidden=false;$('lb').querySelector('.x').focus()}
function lbStep(d){LB.i=(LB.i+d+LB.list.length)%LB.list.length;lbShow()}
function lbClose(){$('lb').hidden=true;$('lbi').removeAttribute('src');focusMsg()}
document.addEventListener('click',e=>{const i=e.target.closest('#stream img,#gallery img');if(i){lbOpen(i.getAttribute('src'));return}
  if(e.target.closest('#lb .x')||e.target.id==='lb')lbClose();else if(e.target.closest('#lb .p'))lbStep(-1);else if(e.target.closest('#lb .n'))lbStep(1)});
document.addEventListener('keydown',e=>{if($('lb').hidden)return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbStep(-1);if(e.key==='ArrowRight')lbStep(1)});

// Scenario editing: premise is editable per character; saving re-derives the scene server-side.
$('scEdit').onclick=()=>{$('scText').value=pv(cur,'scenario');$('scForm').hidden=false;$('premise').hidden=true;$('scEdit').hidden=true;$('scText').focus()};
const scClose=()=>{$('scForm').hidden=true;$('premise').hidden=false;$('scEdit').hidden=false};
$('scCancel').onclick=scClose;
async function scSend(text){$('scSave').disabled=$('scReset').disabled=true;
  try{const r=await(await post('/api/scenario/'+cur.id,{scenario:text})).json();cur.scenario=r.scenario;cur.scenario_tr=r.scenario_tr;cur.customScenario=r.customScenario;
    fillPersona();scClose();addMsg({role:'system',kind:'note',content:t('scSaved')+(text?': '+text:''),ts:Date.now()})}
  catch(e){note(e.message)}$('scSave').disabled=$('scReset').disabled=false}
$('scSave').onclick=()=>scSend($('scText').value.trim());
$('scReset').onclick=()=>scSend('');

// Always keep the newest message in view: on new nodes, when images/videos finish loading, and after switching characters.
const toBottom=()=>{const s=$('stream');s.scrollTop=s.scrollHeight};
new MutationObserver(()=>{toBottom();requestAnimationFrame(toBottom)}).observe($('stream'),{childList:true,subtree:true});
$('stream').addEventListener('load',toBottom,true);$('stream').addEventListener('loadeddata',toBottom,true);

api('/api/models').then(r=>r.json()).then(list=>{$('model').innerHTML='<option value="">Auto (EN: uncensored-role-play, TR: gemma-4-uncensored)</option>'+list.map(m=>`<option value="${m.id}">${m.id}${m.out?' ($'+m.out+'/M out)':''}</option>`).join('');
  $('model').value=S.model||''}).catch(()=>{});
$('model').onchange=e=>{S.model=e.target.value;saveS();if(cur)showModel()};
$('q').oninput=renderThreads;
$('settingsBtn').onclick=()=>{$('settings').hidden=!$('settings').hidden};
$('lang').onchange=e=>{S.lang=e.target.value;saveS();applyI18n();if(cur)showModel()};
$('emoji').onchange=e=>{S.emoji=e.target.checked;saveS()};
applyI18n();
refreshCosts();(async()=>{P=await(await api('/api/personas')).json();renderThreads();select(P[0])})();
</script></body></html>
